{% set name = "redgiant" %}
{% set rg_version_partial = "2025" %}
{% set rg_version_minor = "6" %}
{% set rg_version_patch = "0" %}
{% set uni_version_partial = "2025" %}
{% set uni_version_minor = "3" %}
{% set uni_version_patch = "3" %}
{% set rg_version = rg_version_partial + "." + rg_version_minor + "." + rg_version_patch %}
{% set uni_version = uni_version_partial + "." + uni_version_minor + "." + uni_version_patch %}

package:
  name: {{ name }}
  version: {{ version }}

source:
- url: archive_files/Red_Giant_{{ rg_version.replace(".", "_") }}_Universe_{{ uni_version.replace(".", "_") }}_installation.zip # [win64]
  sha256: 41c820220adfc970c63f0c2e667679d6d9eafc335ee2f55a12d0eb620ab03d03 # [win64]
  folder: redgiant

build:
  number: 0
  # These build options for repackaging an application
  # https://docs.conda.io/projects/conda-build/en/latest/resources/define-metadata.html
  binary_relocation: False
  detect_binary_files_with_prefix: False
  missing_dso_whitelist:
  - "**"

requirements:
  build:
    - aftereffects
  run:
    - aftereffects

about:
  home: https://www.maxon.net/en/red-giant
  license: Commercial
  summary: Red Giant is a comprehensive toolkit designed for video post-production, motion graphics, and visual effects. It offers rich color grading, smooth transitions, realistic visual effects, motion design templates and tools to create and edit your visuals.
