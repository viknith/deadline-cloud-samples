specificationVersion: jobtemplate-2023-09
name: After Effects Docker Render With Red Giant
description: Render After Effects projects using Docker containers
parameterDefinitions:
  - name: ProjectFile
    type: PATH
    objectType: FILE
    dataFlow: IN
    userInterface:
      control: CHOOSE_INPUT_FILE
      label: Project file
      fileFilters:
        - label: After Effects project files
          patterns:
            - "*.aep"
            - "*.aepx"
    description: The After Effects project file to render

  - name: RenderQueueIndex
    type: INT
    userInterface:
      control: SPIN_BOX
      label: Render Queue Index
    default: 1
    description: Index of the render queue item to render

  - name: StartFrame
    type: INT
    userInterface:
      control: SPIN_BOX
      label: Start Frame
    default: 96
    description: Start frame to render

  - name: EndFrame
    type: INT
    userInterface:
      control: SPIN_BOX
      label: End Frame
    default: 215
    description: End frame to render

  - name: OutputDir
    type: PATH
    objectType: DIRECTORY
    dataFlow: OUT
    userInterface:
      control: CHOOSE_DIRECTORY
      label: Output Directory
    default: "./output"
    description: Directory for rendered output files

  - name: ECR_REGISTRY
    type: STRING
    userInterface:
      control: LINE_EDIT
      label: ECR Registry
    default: "484745417699.dkr.ecr.us-west-2.amazonaws.com"
    description: ECR registry URI

  - name: OutputFilename
    type: STRING
    userInterface:
      control: LINE_EDIT
      label: Output Filename Pattern
    default: "render_[#####].png"
    description: Output filename pattern with frame number placeholder

steps:
- name: Render
  hostRequirements:
    attributes:
      - name: attr.worker.os.family
        anyOf:
          - windows
  script:
    actions:
      onRun:
        command: powershell
        args:
          - "-ExecutionPolicy"
          - "Bypass"
          - "-File"
          - "{{Task.File.Run}}"
    embeddedFiles:
      - name: Run
        filename: render.ps1
        type: TEXT
        runnable: true
        data: |
          Write-Host "Starting After Effects Docker render..."
          Write-Host "Project: {{Param.ProjectFile}}"
          Write-Host "Frames: {{Param.StartFrame}}-{{Param.EndFrame}}"
          Write-Host "Output: {{Param.OutputDir}}"

          # Create .docker directory if it doesn't exist
          Write-Host "Creating .docker directory if it doesn't exist"
          New-Item -ItemType Directory -Path "$env:USERPROFILE\.docker" -Force | Out-Null

          # Apply Docker config workaround to avoid credential helper issues
          $path = "$env:USERPROFILE\.docker\config.json"
          $content = @'
          {
              "auths": {
                  "{{Param.ECR_REGISTRY}}/ae-redgiant-full": {}
              },
              "credStore": ""
          }
          '@
          Write-Host "Apply credentials workaround by writing $content to $path"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($path, $content, $utf8NoBom)

          # Start Docker Desktop if not running
          $dockerDesktop = Get-Process "Docker Desktop" -ErrorAction SilentlyContinue
          if (-not $dockerDesktop) {
              Write-Host "Starting Docker Desktop..."
              Start-Process "C:\Program Files\Docker\Docker\Docker Desktop.exe" -WindowStyle Hidden
          }

          # Wait for all required Docker processes
          $requiredProcesses = @("Docker Desktop", "com.docker.build", "com.docker.backend", "com.docker.service", "dockerd")
          $timeout = 120
          $elapsed = 0

          Write-Host "Waiting for Docker processes to start..."
          do {
              Start-Sleep 5
              $elapsed += 5

              $runningProcesses = @()
              foreach ($processName in $requiredProcesses) {
                  if (Get-Process $processName -ErrorAction SilentlyContinue) {
                      $runningProcesses += $processName
                  }
              }

              $allRunning = $runningProcesses.Count -eq $requiredProcesses.Count
              Write-Host "Running: $($runningProcesses.Count)/$($requiredProcesses.Count) processes"

          } while (-not $allRunning -and $elapsed -lt $timeout)

          if (-not $allRunning) {
              Write-Error "Docker processes failed to start within $timeout seconds"
              exit 1
          }

          Write-Host "All Docker processes are running"

          # Switch to default Docker context and lock it
          Write-Host "Switching to default Docker context..."
          docker context use default
          $env:DOCKER_CONTEXT = "default"

          Write-Host "Docker version:"
          docker version

          Write-Host "Docker info:"
          docker info

          Write-Host "Logging into ECR..."
          aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin {{Param.ECR_REGISTRY}}

          Write-Host "Creating output directory..."
          New-Item -ItemType Directory -Force -Path "{{Param.OutputDir}}"

          Write-Host "Creating and starting container..."
          $containerName = "ae-render-$(Get-Random)"
          docker run -d --name $containerName `
            --dns 169.254.169.253 `
            --gpus all `
            -e "AERENDER_EXECUTABLE=$env:AERENDER_EXECUTABLE" `
            -e "MAXON_RENDERONLY=$env:MAXON_RENDERONLY" `
            -e "redshift_LICENSE=$env:redshift_LICENSE" `
            {{Param.ECR_REGISTRY}}/ae-redgiant-full:latest ping -t localhost

          Write-Host "Copying project file to container..."
          docker cp "{{Param.ProjectFile}}" "${containerName}:C:\project.aep"

          # Create output directory inside container
          Write-Host "Creating output directory inside container..."
          docker exec $containerName powershell -Command "New-Item -ItemType Directory -Path 'C:\output' -Force"

          # Debug license configuration and processes
          Write-Host "=== DEBUGGING INFORMATION ==="
          Write-Host "Host redshift_LICENSE: $env:redshift_LICENSE"

          Write-Host "Container environment variables:"
          docker exec $containerName cmd /c set | findstr -i redshift
          docker exec $containerName cmd /c set | findstr -i maxon
          docker exec $containerName cmd /c set | findstr -i license

          Write-Host "All container processes:"
          docker exec $containerName tasklist

          # Test license server connectivity for multiple servers
          if ($env:redshift_LICENSE) {
              $servers = $env:redshift_LICENSE -split ';'
              foreach ($serverEntry in $servers) {
                  $parts = $serverEntry -split '@'
                  if ($parts.Length -eq 2) {
                      $port = $parts[0]
                      $server = $parts[1]
                      Write-Host "Testing connectivity to license server ${server}:${port}..."
                      docker exec $containerName powershell -Command "Test-NetConnection -ComputerName '$server' -Port $port"
                  }
              }
          }
          Write-Host "=== END DEBUGGING ==="

          # Run render with real-time output streaming
          Write-Host "Running After Effects render with real-time output..."
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "docker"
          $psi.Arguments = "exec $containerName `"C:\Program Files\Adobe\Adobe After Effects 2025\Support Files\aerender.exe`" -project `"C:\project.aep`" -rqindex {{Param.RenderQueueIndex}} -s {{Param.StartFrame}} -e {{Param.EndFrame}} -output `"C:\output\{{Param.OutputFilename}}`" -v ERRORS_AND_PROGRESS -close DO_NOT_SAVE_CHANGES -continueOnMissingFootage -sound OFF"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false

          $process = [System.Diagnostics.Process]::Start($psi)
          while (!$process.StandardOutput.EndOfStream) {
              $line = $process.StandardOutput.ReadLine()
              Write-Host "[AERENDER] $line"
          }
          $process.WaitForExit()

          Write-Host "Container logs:"
          docker logs $containerName

          if ($process.ExitCode -ne 0) {
              Write-Error "After Effects render failed with exit code: $($process.ExitCode)"
              exit 1
          }

          Write-Host "Container logs:"
          docker logs $containerName

          Write-Host "Copying rendered files to output directory..."
          docker cp "${containerName}:C:/output/" "{{Param.OutputDir}}"

          Write-Host "Cleaning up container..."
          docker rm -f $containerName

          Write-Host "Render completed."