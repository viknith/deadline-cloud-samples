specificationVersion: jobtemplate-2023-09
name: After Effects Docker Render
description: Render After Effects projects using Docker containers
parameterDefinitions:
  - name: ProjectFile
    type: PATH
    objectType: FILE
    dataFlow: IN
    userInterface:
      control: CHOOSE_INPUT_FILE
      label: Project file
      fileFilters:
        - label: After Effects project files
          patterns:
            - "*.aep"
            - "*.aepx"
    description: The After Effects project file to render

  - name: RenderQueueIndex
    type: INT
    userInterface:
      control: SPIN_BOX
      label: Render Queue Index
    default: 1
    description: Index of the render queue item to render

  - name: StartFrame
    type: INT
    userInterface:
      control: SPIN_BOX
      label: Start Frame
    default: 96
    description: Start frame to render

  - name: EndFrame
    type: INT
    userInterface:
      control: SPIN_BOX
      label: End Frame
    default: 215
    description: End frame to render

  - name: OutputDir
    type: PATH
    objectType: DIRECTORY
    dataFlow: OUT
    userInterface:
      control: CHOOSE_DIRECTORY
      label: Output Directory
    default: "./output"
    description: Directory for rendered output files

  - name: ECR_REGISTRY
    type: STRING
    userInterface:
      control: LINE_EDIT
      label: ECR Registry
    default: "484745417699.dkr.ecr.us-west-2.amazonaws.com"
    description: ECR registry URI

steps:
- name: Render
  hostRequirements:
    attributes:
      - name: attr.worker.os.family
        anyOf:
          - windows
  script:
    actions:
      onRun:
        command: powershell
        args:
          - "-File"
          - "{{Task.File.Run}}"
    embeddedFiles:
      - name: Run
        filename: render.ps1
        type: TEXT
        runnable: true
        data: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting After Effects Docker render..."
          Write-Host "Project: {{Param.ProjectFile}}"
          Write-Host "Frames: {{Param.StartFrame}}-{{Param.EndFrame}}"
          Write-Host "Output: {{Param.OutputDir}}"

          # Check Docker processes
          Write-Host "Checking Docker processes..."
          Get-Process | Where-Object { $_.ProcessName -like "*docker*" } | ForEach-Object {
              Write-Host "Docker process: $($_.ProcessName) (PID: $($_.Id))"
          }

          # Check Docker service status
          Write-Host "Checking Docker service status..."
          try {
              $service = Get-Service -Name "com.docker.service" -ErrorAction SilentlyContinue
              if ($service) {
                  Write-Host "com.docker.service status: $($service.Status)"
              } else {
                  Write-Host "com.docker.service not found"
              }
          } catch {
              Write-Host "Error checking service: $($_.Exception.Message)"
          }

          # Switch to default Docker context
          Write-Host "Switching to default Docker context..."
          docker context use default

          # Test Docker connectivity
          Write-Host "Testing Docker connectivity..."
          try {
              docker version
              Write-Host "Docker daemon is accessible"
          } catch {
              Write-Host "ERROR: Docker daemon not accessible: $($_.Exception.Message)"
              exit 1
          }

          # ECR Login - let docker run be the real test
          Write-Host "Logging into ECR..."
          $originalErrorAction = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $loginOutput = aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin {{Param.ECR_REGISTRY}} 2>&1
          $loginExitCode = $LASTEXITCODE
          $ErrorActionPreference = $originalErrorAction

          Write-Host "Login output: $loginOutput"
          Write-Host "Login exit code: $loginExitCode"

          if ($loginOutput -match "Login Succeeded") {
              Write-Host "ECR authentication successful (credential storage may have failed)"
          } else {
              Write-Host "ECR authentication may have failed - will test with docker run"
          }

          # Run Docker container
          Write-Host "Starting Docker container..."
          docker run --rm `
            -v "{{Session.WorkingDirectory}}:C:\workspace" `
            -v "{{Session.WorkingDirectory}}\{{Param.OutputDir}}:C:\output" `
            {{Param.ECR_REGISTRY}}/ae-redgiant-full:latest `
            "C:\Program Files\Adobe\Adobe After Effects 2025\Support Files\aerender.exe" `
            -project "C:\workspace\{{Param.ProjectFile}}" `
            -rqindex {{Param.RenderQueueIndex}} `
            -s {{Param.StartFrame}} `
            -e {{Param.EndFrame}} `
            -output "C:\output\comp_mainTitle_TORENDER_[#####].png" `
            -v ERRORS_AND_PROGRESS `
            -close DO_NOT_SAVE_CHANGES

          Write-Host "Render completed."