specificationVersion: jobtemplate-2023-09
name: After Effects Docker Render
description: Render After Effects projects using Docker containers
parameterDefinitions:
  - name: ProjectFile
    type: PATH
    objectType: FILE
    dataFlow: IN
    userInterface:
      control: CHOOSE_INPUT_FILE
      label: Project file
      fileFilters:
        - label: After Effects project files
          patterns:
            - "*.aep"
            - "*.aepx"
    description: The After Effects project file to render

  - name: RenderQueueIndex
    type: INT
    userInterface:
      control: SPIN_BOX
      label: Render Queue Index
    default: 1
    description: Index of the render queue item to render

  - name: StartFrame
    type: INT
    userInterface:
      control: SPIN_BOX
      label: Start Frame
    default: 96
    description: Start frame to render

  - name: EndFrame
    type: INT
    userInterface:
      control: SPIN_BOX
      label: End Frame
    default: 215
    description: End frame to render

  - name: OutputDir
    type: PATH
    objectType: DIRECTORY
    dataFlow: OUT
    userInterface:
      control: CHOOSE_DIRECTORY
      label: Output Directory
    default: "./output"
    description: Directory for rendered output files

  - name: ECR_REGISTRY
    type: STRING
    userInterface:
      control: LINE_EDIT
      label: ECR Registry
    default: "484745417699.dkr.ecr.us-west-2.amazonaws.com"
    description: ECR registry URI

steps:
- name: Render
  hostRequirements:
    attributes:
      - name: attr.worker.os.family
        anyOf:
          - windows
  script:
    actions:
      onRun:
        command: powershell
        args:
          - "-File"
          - "{{Task.File.Run}}"
    embeddedFiles:
      - name: Run
        filename: render.ps1
        type: TEXT
        runnable: true
        data: |
          $logFile = "C:\temp\docker_render.log"

          if (-not (Test-Path "C:\temp")) {
              New-Item -ItemType Directory -Path "C:\temp" -Force
          }

          Write-Host "Starting Docker render process..."

          Write-Host "Running elevated Docker commands..."
          Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass", "-File", "{{Task.File.DockerRender}}" -Verb RunAs -Wait

          Write-Host "=== Process Output ==="
          if (Test-Path $logFile) {
              Get-Content $logFile | ForEach-Object { Write-Host $_ }
          } else {
              Write-Host "No log file found"
          }

          Remove-Item $logFile -ErrorAction SilentlyContinue
      - name: DockerRender
        filename: docker_render.ps1
        type: TEXT
        runnable: true
        data: |
          $logFile = "C:\temp\docker_render.log"

          function Log($message) {
              $message | Out-File -FilePath $logFile -Append -Encoding UTF8
          }

          Log "Starting After Effects Docker render..."
          Log "Project: {{Param.ProjectFile}}"
          Log "Frames: {{Param.StartFrame}}-{{Param.EndFrame}}"
          Log "Output: {{Param.OutputDir}}"

          Log "Checking Docker processes..."
          Get-Process | Where-Object { $_.ProcessName -like "*docker*" } | ForEach-Object {
              Log "Docker process: $($_.ProcessName) (PID: $($_.Id))"
          }

          Log "Checking Docker service status..."
          try {
              $service = Get-Service -Name "com.docker.service" -ErrorAction SilentlyContinue
              if ($service) {
                  Log "com.docker.service status: $($service.Status)"
              } else {
                  Log "com.docker.service not found"
              }
          } catch {
              Log "Error checking service: $($_.Exception.Message)"
          }

          Log "Switching to default Docker context..."
          docker context use default 2>&1 | ForEach-Object { Log $_ }

          Log "Testing Docker connectivity..."
          try {
              docker version 2>&1 | ForEach-Object { Log $_ }
              Log "Docker daemon is accessible"
          } catch {
              Log "ERROR: Docker daemon not accessible: $($_.Exception.Message)"
              exit 1
          }

          Log "Logging into ECR..."
          $loginOutput = aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin {{Param.ECR_REGISTRY}} 2>&1
          $loginOutput | ForEach-Object { Log $_ }

          if ($loginOutput -match "Login Succeeded") {
              Log "ECR authentication successful"
          } else {
              Log "ECR authentication may have failed - will test with docker run"
          }

          Log "Starting Docker container..."
          docker run --rm `
            -v "{{Session.WorkingDirectory}}:C:\workspace" `
            -v "{{Session.WorkingDirectory}}\{{Param.OutputDir}}:C:\output" `
            {{Param.ECR_REGISTRY}}/ae-redgiant-full:latest `
            "C:\Program Files\Adobe\Adobe After Effects 2025\Support Files\aerender.exe" `
            -project "C:\workspace\{{Param.ProjectFile}}" `
            -rqindex {{Param.RenderQueueIndex}} `
            -s {{Param.StartFrame}} `
            -e {{Param.EndFrame}} `
            -output "C:\output\comp_mainTitle_TORENDER_[#####].png" `
            -v ERRORS_AND_PROGRESS `
            -close DO_NOT_SAVE_CHANGES 2>&1 | ForEach-Object { Log $_ }

          Log "Render completed."